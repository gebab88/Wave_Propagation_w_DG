# Builds the solver and runs all tests on Linux, on x86_64 and on arm64 (the
# Raspberry Pi architecture). The packages are those of Dockerfile.linux that
# the build and the tests need; time(1) is for the memory test.
# The Windows jobs build natively in MSYS2 (UCRT64/GCC on x64, CLANGARM64/clang
# on arm64) with the Makefile; there is no local Windows machine, so CI is the
# only place where the Windows port is verified.
#
# Build and tests run in separate jobs. A build job packs bin/Release,
# bin/Debug and obj into a tar file (tar keeps the executable bits) and uploads
# it as an artifact; the test job of the same platform unpacks it after the
# checkout. `tar -m` gives the files the unpack time, so they are newer than
# the checked-out sources and make only relinks instead of compiling again.
# A test job needs all build jobs of its OS to finish, but it runs even if one
# of them failed, so a broken build on one architecture does not skip the
# tests of the other. Its download step then fails at once.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build:
    name: build ${{ matrix.runner }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy: &linux-strategy
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - &linux-dependencies
        name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ffmpeg libarmadillo-dev liblapack-dev \
            libopenblas-dev libyaml-cpp-dev make time

      - name: Build Release and Debug
        run: make Release Debug

      - name: Pack the build
        run: tar -cf build.tar bin/Release bin/Debug obj

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.runner }}-${{ matrix.arch }}
          path: build.tar
          if-no-files-found: error
          retention-days: 1

  linux-test:
    name: test ${{ matrix.runner }} ${{ matrix.arch }}
    needs: linux-build
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy: *linux-strategy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.runner }}-${{ matrix.arch }}

      - *linux-dependencies

      - &unpack
        name: Unpack the build
        id: unpack
        run: |
          tar -xmf build.tar
          # The tests must use the build job's objects, not compile new ones.
          if make -n Release Debug | grep -- ' -c '; then
            echo "::error::make would compile again although the build was unpacked"
            exit 1
          fi

      - name: Run all tests
        run: make test

  windows-build:
    name: build ${{ matrix.runner }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy: &windows-strategy
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025,   arch: x64,   msystem: UCRT64,     prefix: ucrt64,     compiler: "gcc:p" }
          - { runner: windows-11-arm, arch: arm64, msystem: CLANGARM64, prefix: clangarm64, compiler: "clang:p llvm-openmp:p" }
    defaults: &windows-defaults
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - &setup-msys2
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make tar
          pacboy: ${{ matrix.compiler }} armadillo:p openblas:p yaml-cpp:p ffmpeg:p
      - name: Show environment
        run: uname -s; uname -m; echo "MSYSTEM=$MSYSTEM"; (g++ --version || clang++ --version) | head -1
      - name: Release and Debug build
        run: make Release Debug
      - name: Pack the build
        run: tar -cf build.tar bin/Release bin/Debug obj
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.runner }}-${{ matrix.arch }}
          path: build.tar
          if-no-files-found: error
          retention-days: 1

  windows-test:
    name: test ${{ matrix.runner }} ${{ matrix.arch }}
    needs: windows-build
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy: *windows-strategy
    defaults: *windows-defaults
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.runner }}-${{ matrix.arch }}
      - *setup-msys2
      - *unpack
      - name: Run all tests
        run: make test
        env:
          # The ConPTY helper of the menu tests appends the unfiltered console
          # output here; the next step shows it if a test failed.
          CONPTY_RUN_RAW: ${{ runner.temp }}/conpty-raw.log
      - name: Show raw ConPTY output
        if: failure()
        run: cat -v "$CONPTY_RUN_RAW" || true
        env:
          CONPTY_RUN_RAW: ${{ runner.temp }}/conpty-raw.log
      - name: Start the solver from PowerShell
        # Outside MSYS2: the program must find ffmpeg and its DLLs through PATH alone.
        # Needs only the unpacked build, so it runs even if a test failed.
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\${{ matrix.prefix }}\bin;$env:PATH"
          $out = $null | .\bin\Release\DiscontinousGalerkin.exe tests\linux-smoke-config.yaml 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          Write-Host "exit code: $code"
          if ($code -ne 0) { Write-Host "Solver exited with code $code"; exit 1 }
          if ($out -notmatch 'Video written to output\.mp4') { Write-Host "Missing 'Video written to output.mp4' line"; exit 1 }
          $size = (Get-Item output.mp4 -ErrorAction SilentlyContinue).Length
          Write-Host "output.mp4 size: $size bytes"
          if (-not $size) { Write-Host "output.mp4 is missing or empty"; exit 1 }
      - name: Start the solver from PowerShell without an argument
        # The README's run/ workflow: started from a subdirectory without an
        # argument, the program reads config.yaml two levels above bin\Release.
        # argv[0] uses backslashes here. The config, written for this step only,
        # turns plotting off, so "Plotting disabled by config." shows that it
        # was read.
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\${{ matrix.prefix }}\bin;$env:PATH"
          (Get-Content tests\linux-smoke-config.yaml) -replace '^EnablePlotting:.*', 'EnablePlotting: false' | Set-Content config.yaml
          New-Item -ItemType Directory -Force run | Out-Null
          Set-Location run
          $out = $null | ..\bin\Release\DiscontinousGalerkin.exe 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          Write-Host "exit code: $code"
          if ($code -ne 0) { Write-Host "Solver exited with code $code"; exit 1 }
          if ($out -notmatch 'Using: RungeKuttaClassic') { Write-Host "Missing 'Using: RungeKuttaClassic' line"; exit 1 }
          if ($out -notmatch 'Plotting disabled by config\.') { Write-Host "Missing 'Plotting disabled by config.' line: config.yaml was not read"; exit 1 }
