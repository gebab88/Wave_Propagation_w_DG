# Like menu-test-config.yaml but with plotting enabled (video only),
# for the "Press enter to exit." test. Run it in a scratch directory.
TimeIntegration: PredictorCorrectorHeun
EnablePlotting: true
# 1601 frames, one per solver step as before VideoTimePerSecond existed; with
# the default 1.0e-3 it would be 12001, and x64 under QEMU would need about
# 160 s to draw them instead of about 22 s.
VideoTimePerSecond: 7.5e-3
OpenMPMinCells: 50
OpenMPThreads: 2
OpenMPLargeMinCells: 512
OpenMPLargeThreads: 4
CFLReserve: 0.45

N: 2
order: 2

t0: 0.0
t1: 2.0e-1

x0: 0.0
x1: 0.5

c_0: 300.0
rho_0: 1.5

freq_i: 3000.0

mu: 0.1
sigma: 0.02
height: 1.0
